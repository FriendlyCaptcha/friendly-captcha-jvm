import com.vanniktech.maven.publish.SonatypeHost

plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish'
}

ext {
    sdkVersion = "1.0.0"
    sdkName = "friendly-captcha-jvm"
}

version = sdkVersion
group = "com.friendlycaptcha.jvm"

repositories {
    mavenCentral()
}

dependencies {
     // Jackson dependencies
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.13.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.13.3'

    // JUnit 5 dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'
}

tasks.withType(JavaCompile) {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

tasks.test {
    useJUnitPlatform()
}

task generateVersionClass {
    doLast {
        def outputDir = file("src/main/java/com/friendlycaptcha/jvm/sdk")
        outputDir.mkdirs()
        def versionFile = new File(outputDir, "Version.java")
        versionFile.text = """// Note: This file is generated by the build.gradle script. DO NOT EDIT.
package com.friendlycaptcha.jvm.sdk;

public final class Version {
    public static final String SDK_VERSION = "${sdkVersion}";
    public static final String SDK_NAME = "${sdkName}";
    public static final String SDK_IDENTIFIER = "${sdkName}@${sdkVersion}";
}
"""
    }
}

compileJava.dependsOn generateVersionClass

mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    pom {
        name = sdkName
        description = "Friendly Captcha JVM SDK"
        inceptionYear = "2025"

        url = "https://github.com/FriendlyCaptcha/friendly-captcha-jvm"
        licenses {
            license {
                name = "MIT"
                url = "https://opensource.org/licenses/MIT"
            }
        }

        developers {
            developer {
                id = "friendlycaptcha"
                name = "Friendly Captcha GmbH"
                email = "dev@friendlycaptcha.com"
                url = "https://github.com/FriendlyCaptcha"
            }
        }
        scm {
            url = "https://github.com/FriendlyCaptcha/friendly-captcha-jvm"
            connection = "scm:git:git://github.com/FriendlyCaptcha/friendly-captcha-jvm.git"
        }
    }
}
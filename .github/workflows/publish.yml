name: Publish to Maven Central

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 8
        uses: actions/setup-java@v2
        with:
          distribution: 'adopt'
          java-version: '8'

      - name: Extract version from tag
        id: extract_version
        run: echo "::set-output name=VERSION::${GITHUB_REF#refs/tags/}"

      - name: Set version in pom.xml
        run: mvn versions:set -DnewVersion=${{ steps.extract_version.outputs.VERSION }}

      - name: Commit version change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b bump-version-to-${{ steps.extract_version.outputs.VERSION }}
          git commit -am "Set version to ${{ steps.extract_version.outputs.VERSION }}"
          git push origin bump-version-to-${{ steps.extract_version.outputs.VERSION }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bump-version-to-${{ steps.extract_version.outputs.VERSION }}
          title: "Set version to ${{ steps.extract_version.outputs.VERSION }}"
          body: "This PR sets the version to${{ steps.extract_version.outputs.VERSION }} based on the release tag."
          base: main

      - name: Build with Maven
        run: mvn clean install
        working-directory: sdk

      - name: Deploy to Maven Central
        run: mvn deploy -P release
        env:
          OSSRH_USERNAME: ${{ secrets.SONATYPE_USER_TOKEN_PASSWORD }}
          OSSRH_PASSWORD: ${{ secrets.SONATYPE_USER_TOKEN_USERNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        working-directory: sdk